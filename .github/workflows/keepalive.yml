name: Alert Workflow Diagnostics

# A no-op schedule did not prevent disabled_inactivity. Manual diagnostics only;
# the independent clock and watchdog live in infra/monitor.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: repo-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect workflow states without enabling or dispatching
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/actions/workflows" --jq '.workflows[] | {name,path,state}'
          echo "Diagnostics cannot prevent inactivity or prove delivery."
