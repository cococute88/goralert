name: Alert Engine Firestore Emulator Tests

on:
  pull_request:
    paths:
      - "alert_engine/**"
      - "lib/alerts/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - "tests/firestore-emulator-rules.test.mjs"
      - "scripts/run-firestore-emulator-tests.mjs"
      - ".github/workflows/alert-engine-emulator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Firestore transaction, concurrency, and owner-rules tests
        run: npx --yes firebase-tools@15.18.0 emulators:exec --only auth,firestore --project demo-goralert "node scripts/run-firestore-emulator-tests.mjs"
