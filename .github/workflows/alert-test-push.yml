name: Goralert Test Push Drain

# Drains browser-enqueued test-push requests (users/{uid}/testPushRequests)
# through the SAME production delivery path as scheduled alerts
# (atomic request claim -> common deliver -> PushChannel / TelegramChannel).
#
# The web "테스트 Push / Telegram" buttons only WRITE a request document; this
# workflow is what actually delivers it via FCM/Telegram (through the SAME
# PushChannel as production). PRIMARY trigger: the button fires workflow_dispatch
# immediately via /api/test-push. HTTP 204 acknowledges dispatch only.
# The external Worker provides fallback after approved deployment; queue
# observation is the sole source of execution and delivery confirmation.

on:
  workflow_dispatch:
    inputs:
      uid:
        description: "Restrict drain to a single uid (default: all users)"
        required: false
        default: ""
  # The external clock dispatches a five-minute fallback. No GitHub schedule.

permissions:
  contents: read

# Test requests use a dedicated lease namespace and can run independently of
# scheduled occurrences. Serialize drains to avoid unnecessary contention.
concurrency:
  group: goralert-test-drain
  cancel-in-progress: false

jobs:
  drain-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      DEFAULT_TZ: "Asia/Seoul"
    steps:
      - name: Validate Firebase service account secret
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT GitHub Actions secret is not configured."
            exit 1
          fi

      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Drain test-push requests
        env:
          REQUEST_UID: ${{ github.event.inputs.uid }}
        run: |
          args=()
          if [ -n "$REQUEST_UID" ]; then args+=(--uid "$REQUEST_UID"); fi
          python -m alert_engine.main --test-push "${args[@]}"
